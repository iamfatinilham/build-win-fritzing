name: Build Fritzing Windows x64 and ARM64

# This is the one-run entry point when separate native x64 and ARM64 artifacts
# are wanted. It delegates to the universal workflow, which also adds a ZIP
# containing both packages.
on:
  workflow_dispatch:
    inputs:
      fritzing_ref:
        description: 'Fritzing app branch, tag, or 40-character commit'
        required: false
        default: develop
        type: string
      fritzing_parts_ref:
        description: 'Fritzing parts branch, tag, or 40-character commit'
        required: false
        default: develop
        type: string
      ngspice_arm64_archive_url:
        description: 'Optional override for the NGSPICE_ARM64_ARCHIVE_URL secret'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-both:
    uses: ./.github/workflows/build-win-64-Universal.yml
    with:
      fritzing_ref: ${{ inputs.fritzing_ref }}
      fritzing_parts_ref: ${{ inputs.fritzing_parts_ref }}
      ngspice_arm64_archive_url: ${{ inputs.ngspice_arm64_archive_url }}
    secrets: inherit
