name: Build Fritzing on Windows ARM64

on:
  # Manual-only: ARM runners are scarce and should never run on a push.
  workflow_dispatch:
    inputs:
      fritzing_ref:
        description: 'Fritzing app branch, tag, or 40-character commit'
        required: false
        default: develop
        type: string
      fritzing_parts_ref:
        description: 'Fritzing parts branch, tag, or 40-character commit'
        required: false
        default: develop
        type: string
      ngspice_arm64_archive_url:
        description: 'Optional replacement for the NGSPICE_ARM64_ARCHIVE_URL secret'
        required: false
        type: string
  workflow_call:
    inputs:
      fritzing_ref:
        required: false
        default: develop
        type: string
      fritzing_parts_ref:
        required: false
        default: develop
        type: string
      ngspice_arm64_archive_url:
        required: false
        type: string
    secrets:
      NGSPICE_ARM64_ARCHIVE_URL:
        required: false

concurrency:
  group: fritzing-windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Native ARM64 package
    # This selects a native ARM64 runner. It is not an x64 build under emulation.
    runs-on: windows-11-arm
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Fritzing app
        uses: actions/checkout@v7.0.1
        with:
          repository: fritzing/fritzing-app
          ref: ${{ inputs.fritzing_ref }}
          path: work/fritzing-app
          persist-credentials: false

      - name: Checkout Fritzing parts
        uses: actions/checkout@v7.0.1
        with:
          repository: fritzing/fritzing-parts
          ref: ${{ inputs.fritzing_parts_ref }}
          path: work/fritzing-parts
          persist-credentials: false

      - name: Read Fritzing build contract
        id: contract
        shell: pwsh
        run: |
          $contract = & .ci\windows\Get-FritzingBuildContract.ps1 -ProjectFile work\fritzing-app\phoenix.pro
          $contract | Format-List | Out-String | Write-Host
          "contract_key=$($contract.Libgit2Version)-$($contract.QuaZipVersion)-$($contract.ClipperVersion)-$($contract.BoostVersion)-$($contract.SvgppVersion)-$($contract.NgspiceVersion)" >> $env:GITHUB_OUTPUT

      - name: Install aqt
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw "pip could not install aqtinstall (exit code $LASTEXITCODE)." }

      - name: Resolve an exact compatible native ARM64 Qt version
        id: qt-version
        shell: pwsh
        run: |
          $qt = & .ci\windows\Resolve-FritzingQtVersion.ps1 -ProjectFile work\fritzing-app\phoenix.pro -QtHost windows_arm64 -Architecture win64_msvc2022_arm64
          $qt | Format-List | Out-String | Write-Host
          "qt_version=$($qt.QtVersion)" >> $env:GITHUB_OUTPUT

      - name: Restore exact native ARM64 Qt kit
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: Qt
          key: fritzing-qt-v3-windows-arm64-${{ steps.qt-version.outputs.qt_version }}-win64_msvc2022_arm64-qtserialport-qt5compat-${{ hashFiles('.ci/windows/Resolve-FritzingQtVersion.ps1') }}

      - name: Install exact compatible native ARM64 Qt kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          QT_VERSION: ${{ steps.qt-version.outputs.qt_version }}
        run: |
          & python -m aqt install-qt windows_arm64 desktop $env:QT_VERSION win64_msvc2022_arm64 --autodesktop --outputdir Qt --modules qtserialport qt5compat
          if ($LASTEXITCODE -ne 0) { throw "aqt failed to install Qt $env:QT_VERSION." }

      - name: Verify selected Qt kit
        id: qt
        shell: pwsh
        run: |
          $qtVersion = '${{ steps.qt-version.outputs.qt_version }}'
          $kits = @(Get-ChildItem -LiteralPath (Join-Path Qt $qtVersion) -Directory | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'bin\qmake.exe') })
          if ($kits.Count -ne 1) { throw "Expected one usable Qt kit under Qt\\$qtVersion; found $($kits.Count)." }
          $qtRoot = $kits[0].FullName
          $qmake = Join-Path $qtRoot 'bin\qmake.exe'
          $version = (& $qmake -query QT_VERSION).Trim()
          $contract = & .ci\windows\Get-FritzingBuildContract.ps1 -ProjectFile work\fritzing-app\phoenix.pro
          if ([version]$version -lt [version]$contract.QtMinimum -or [version]$version -gt [version]$contract.QtMaximum) { throw "Qt $version is outside Fritzing's declared range $($contract.QtRange)." }
          foreach ($file in 'qmake.exe', 'windeployqt.exe', 'Qt6Core5Compat.dll', 'Qt6SerialPort.dll', 'Qt6Svg.dll', 'Qt6SvgWidgets.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $qtRoot "bin\\$file"))) { throw "The selected Qt kit lacks $file." }
          }
          "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
          (Join-Path $qtRoot 'bin') | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
          "qt_version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up native MSVC ARM64 environment
        id: msvc
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $vcvars = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -find 'VC\Auxiliary\Build\vcvarsall.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'Visual Studio ARM64 C++ build tools were not found.' }
          $environment = & cmd.exe /d /s /c "call `"$vcvars`" arm64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat failed with exit code $LASTEXITCODE." }
          foreach ($line in $environment) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsVersion|WindowsSDKVersion|VisualStudioVersion)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            }
          }
          $toolset = ($environment | Where-Object { $_ -match '^VCToolsVersion=' } | Select-Object -First 1) -replace '^VCToolsVersion=', ''
          if ([string]::IsNullOrWhiteSpace($toolset)) { throw 'MSVC did not report VCToolsVersion.' }
          "toolset=$toolset" >> $env:GITHUB_OUTPUT

      - name: Restore compatible dependency cache
        uses: actions/cache@v6
        with:
          path: |
            work/zlib
            work/libgit2-*
            work/quazip-*
            work/Clipper1-*
            work/boost_*
            work/svgpp-*
            work/ngspice-*
          key: fritzing-deps-v8-windows-arm64-msvc-${{ steps.msvc.outputs.toolset }}-qt-${{ steps.qt.outputs.qt_version }}-${{ steps.contract.outputs.contract_key }}-${{ hashFiles('.ci/windows/**') }}

      - name: Build, verify, and package ARM64
        id: build
        shell: pwsh
        env:
          NGSPICE_ARM64_ARCHIVE_URL: ${{ inputs.ngspice_arm64_archive_url || secrets.NGSPICE_ARM64_ARCHIVE_URL }}
          FRITZING_REF: ${{ inputs.fritzing_ref }}
          FRITZING_PARTS_REF: ${{ inputs.fritzing_parts_ref }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGSPICE_ARM64_ARCHIVE_URL)) {
            throw 'Set the NGSPICE_ARM64_ARCHIVE_URL secret or provide the workflow input. The public ngspice archive is x64-only.'
          }
          .ci\windows\build-windows.ps1 -Architecture arm64 -NgspiceArchiveUrl $env:NGSPICE_ARM64_ARCHIVE_URL -FritzingRef $env:FRITZING_REF -FritzingPartsRef $env:FRITZING_PARTS_REF -FritzingAppPath work\fritzing-app -FritzingPartsPath work\fritzing-parts

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-Windows-arm64
          path: artifacts/*.zip
          if-no-files-found: error
